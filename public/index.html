<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hidden Markov Regime Detection</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <h1 class="title">Hidden Markov Regime Detection</h1>
      <div class="subline">
        y_t | s_t ~ N(μ_{s_t}, σ_{s_t}^2) &nbsp;&nbsp;|&nbsp;&nbsp; P(s_t | y) ∝ α_t(s_t) β_t(s_t)
      </div>
      <div class="subline2">
        3 regimes: Bull μ=+0.09% &nbsp;&nbsp; Bear μ=-0.06% &nbsp;&nbsp; Crisis μ=-0.20%
      </div>
      <div class="market-row">
        <label for="marketSelect">Market</label>
        <select id="marketSelect"></select>
        <label for="periodSelect">Range</label>
        <select id="periodSelect"></select>
        <button id="snapshotBtn" type="button">Snapshot</button>
        <span id="marketStatus">Loading…</span>
      </div>

      <div class="board">
        <div class="left-panel">
          <div class="left-container">
            <div id="left3d"></div>
            <div id="leftOverlay" class="left-overlay" title="Interaction disabled"></div>
          </div>
        </div>
        <div class="right-column">
          <div id="right4"></div>
        </div>
      </div>
    </div>

    <div id="hud">CONNECTING...</div>

    <script src="/app.js"></script>
  </body>
</html>
